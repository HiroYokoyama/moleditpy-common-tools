name: Common tools
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'tools/**', '.github/workflows/ci.yml', 'VERSION', 'ruff.toml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'tools/**', '.github/workflows/ci.yml', 'VERSION', 'ruff.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: python -m pytest tests -q
